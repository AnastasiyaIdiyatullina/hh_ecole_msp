name: Update HH feed

on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов (UTC)
  workflow_dispatch:          # ручной запуск из вкладки Actions

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Пересобрать фид МШП
        run: python build_feed.py --feed docs/feed.xml

      - name: Пересобрать фид Эколь
        if: "!cancelled()"
        run: python build_feed.py --feed docs/feed_ecole.xml

      - name: Закоммитить, если цены изменились
        if: "!cancelled()"
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/feed.xml docs/feed_ecole.xml
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Update feed prices"
            git push
          fi
